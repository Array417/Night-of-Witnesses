x-api-environment: &api-env
  DATABASE_URL: postgresql://now:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/now
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
  CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET in .env}
  APP_ENV: production
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
  ORIGIN: ${ORIGIN:?Set ORIGIN in .env}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@now.example}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: now
      POSTGRES_USER: now
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U now -d now"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: {context: ., dockerfile: api/Dockerfile}
    image: night-of-witnesses-api:latest
    environment: *api-env
    command: ["python", "-m", "db.migrate"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    image: night-of-witnesses-api:latest
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 30
  seed:
    image: night-of-witnesses-api:latest
    profiles: [tools]
    environment:
      <<: *api-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@now.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: ["python", "-m", "db.seed"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  now-game:
    build:
      context: .
      dockerfile: Dockerfile
    image: night-of-witnesses:latest
    container_name: now-game
    # 開機 / 當機後自動重啟（配合 colima 登入時自動啟動即等於開機自動開服）
    restart: unless-stopped
    ports:
      # 對外(主機/路由器轉發) 8213 -> 容器內部 3000
      # 綁 0.0.0.0 先可以由路由器 port forwarding 轉入嚟
      - "0.0.0.0:8213:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      API_BASE_URL: http://api:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
      # 瀏覽器實際使用嘅來源網址（逗號分隔多個）。
      # 互聯網玩家經路由器入嚟要改成你的公網 IP / DDNS 網域，例如：
      #   ORIGIN=http://1.2.3.4:8213 或 http://now.example.com:8213
      # 本地測試用 localhost 即可。於 .env 檔覆寫（見 .env.example）。
      ORIGIN: "${ORIGIN:-http://localhost:8213,http://127.0.0.1:8213}"
      # 語音 ICE 伺服器（選填），跨網路語音需要 STUN/TURN。
      RTC_ICE_SERVERS_JSON: "${RTC_ICE_SERVERS_JSON:-[]}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:-}"
    depends_on:
      api: {condition: service_healthy}

  # Enable with: docker compose --profile voice up -d --build
  coturn:
    image: coturn/coturn:4.18.0-r0-alpine
    restart: unless-stopped
    profiles: ["voice"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    environment:
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:-}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_EXTERNAL_IP: "${TURN_EXTERNAL_IP:-}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$TURN_SHARED_SECRET" && test -n "$$TURN_HOST" && test -n "$$TURN_EXTERNAL_IP" || { echo 'Set TURN_HOST, TURN_EXTERNAL_IP and TURN_SHARED_SECRET'; exit 1; }
        exec turnserver -n --log-file=stdout --fingerprint --use-auth-secret \
          --static-auth-secret="$$TURN_SHARED_SECRET" --realm="$$TURN_HOST" \
          --external-ip="$$TURN_EXTERNAL_IP" --listening-port=3478 \
          --min-port=49160 --max-port=49200 --no-tls \
          --no-cli --no-multicast-peers --user-quota=12 --total-quota=1200

  caddy:
    image: caddy:2-alpine
    container_name: now-caddy
    restart: unless-stopped
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
    depends_on:
      - now-game
    ports:
      # HTTPS 對外入口。憑證由 Let's Encrypt 自動簽發及續期。
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:


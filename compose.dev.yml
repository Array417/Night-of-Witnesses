name: night-of-witnesses-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: night-of-witnesses-dev:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
      RTC_ICE_SERVERS_JSON: "[]"
      TURN_HOST: ""
      TURN_SHARED_SECRET: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

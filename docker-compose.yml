services:
  now-game:
    build:
      context: .
      dockerfile: Dockerfile
    image: night-of-witnesses:latest
    container_name: now-game
    # 開機 / 當機後自動重啟（配合 colima 登入時自動啟動即等於開機自動開服）
    restart: unless-stopped
    ports:
      # 對外(主機/路由器轉發) 8213 -> 容器內部 3000
      # 綁 0.0.0.0 先可以由路由器 port forwarding 轉入嚟
      - "0.0.0.0:8213:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      # 瀏覽器實際使用嘅來源網址（逗號分隔多個）。
      # 互聯網玩家經路由器入嚟要改成你的公網 IP / DDNS 網域，例如：
      #   ORIGIN=http://1.2.3.4:8213 或 http://now.example.com:8213
      # 本地測試用 localhost 即可。於 .env 檔覆寫（見 .env.example）。
      ORIGIN: "${ORIGIN:-http://localhost:8213,http://127.0.0.1:8213}"
      # 語音 ICE 伺服器（選填），跨網路語音需要 STUN/TURN。
      RTC_ICE_SERVERS_JSON: "${RTC_ICE_SERVERS_JSON:-[]}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:-}"

  # Enable with: docker compose --profile voice up -d --build
  coturn:
    image: coturn/coturn:4.18.0-r0-alpine
    restart: unless-stopped
    profiles: ["voice"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    environment:
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:-}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_EXTERNAL_IP: "${TURN_EXTERNAL_IP:-}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$TURN_SHARED_SECRET" && test -n "$$TURN_HOST" && test -n "$$TURN_EXTERNAL_IP" || { echo 'Set TURN_HOST, TURN_EXTERNAL_IP and TURN_SHARED_SECRET'; exit 1; }
        exec turnserver -n --log-file=stdout --fingerprint --use-auth-secret \
          --static-auth-secret="$$TURN_SHARED_SECRET" --realm="$$TURN_HOST" \
          --external-ip="$$TURN_EXTERNAL_IP" --listening-port=3478 \
          --min-port=49160 --max-port=49200 --no-tls --no-dtls \
          --no-cli --no-multicast-peers --user-quota=12 --total-quota=1200

  caddy:
    image: caddy:2-alpine
    container_name: now-caddy
    restart: unless-stopped
    depends_on:
      - now-game
    ports:
      # HTTPS 對外入口。憑證由 Let's Encrypt 自動簽發及續期。
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

